[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-md-transformer"
version = "1.2.0"
description = "Deterministic, offline PDF to Markdown converter with inline tables and sidebars"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Michael Macauley" }]
keywords = ["pdf", "markdown", "converter", "offline", "deterministic"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "jsonschema>=4.18,<5",
    "pdfplumber>=0.11",
    "numpy>=1.24",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pytest", "reportlab", "pyinstaller"]

[project.scripts]
pdf2md = "pdf_to_md.cli:main"
pdf2md-mcp = "pdf_to_md.mcp_server:main"

[project.gui-scripts]
pdf2md-gui = "pdf_to_md.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pdf_to_md.evidence" = ["schema/*.json", "schema/*.mjs", "schema/*.ts"]
